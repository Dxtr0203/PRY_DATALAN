{% extends 'base.html' %}{% block title %}Nuevo usuario | DATALAN{% endblock %}{% block content %}<div class="app">{% include 'sidebar.html' %}<main class="main">{% include 'navbar.html' %}<section class="content"><div class="heading"><div><p class="eyebrow">Administración / Usuarios</p><h1>Nuevo usuario</h1><p class="subtitle">Crea una identidad temporal para probar los accesos.</p></div></div><section class="panel form-panel"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label for="full_name">Nombre completo</label><input id="full_name" name="full_name" required></div><div class="field"><label for="username">Nombre de usuario</label><input id="username" name="username" required></div><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required></div><div class="field"><label for="confirm_password">Confirmar contraseña</label><input id="confirm_password" name="confirm_password" type="password" required></div><div class="field"><label for="role">Rol</label><select id="role" name="role">{% for key,item in roles.items %}<option value="{{ key }}">{{ item.label }}</option>{% endfor %}</select></div></div><div class="form-actions"><button class="button" type="submit">Crear usuario</button><a class="button secondary" href="{% url 'users' %}">Cancelar</a></div></form></section></section></main></div>{% endblock %}
